id = "arduino"
name = "Arduino Language Support"
version = "0.0.2"
schema_version = 1
authors = ["Derock Xie <derock@derock.dev>", "Talana <s.j.kusters@proton.me>"]
description = "Complete Arduino development with auto-setup, IntelliSense, board auto-detection, 20 tasks (+9 optional), and 148 snippets."
repository = "https://github.com/SB-CMR-Talana/zed-arduino"
snippets = ["languages/arduino/snippets.json"]

# Capabilities: Transparent declaration of all commands the extension executes
# Note: arduino-cli, clangd, and arduino-language-server paths can be:
#   - Downloaded by extension to work directory
#   - Found on system PATH
#   - User-configured via settings
capabilities = [
  # Sketch detection: find Arduino source files (.ino, .pde) in workspace
  { kind = "process:exec", command = "find", args = ["**", "-type", "f", "(", "-name", "*.ino", "-o", "-name", "*.pde", ")", "-print"] },

  # Arduino CLI: version checking
  { kind = "process:exec", command = "**/arduino-cli", args = ["version"] },

  # Arduino CLI: board detection and management
  { kind = "process:exec", command = "**/arduino-cli", args = ["board", "list", "--format", "json"] },

  # Arduino CLI: core (board support package) management
  { kind = "process:exec", command = "**/arduino-cli", args = ["core", "list"] },
  { kind = "process:exec", command = "**/arduino-cli", args = ["core", "list", "--format", "json"] },
  { kind = "process:exec", command = "**/arduino-cli", args = ["core", "install", "**"] },
  { kind = "process:exec", command = "**/arduino-cli", args = ["core", "install", "**", "--config-file", "**"] },

  # Arduino CLI: library management (for slash commands)
  { kind = "process:exec", command = "**/arduino-cli", args = ["lib", "list", "--format", "json"] },

  # Arduino CLI: compile database generation (for IntelliSense)
  # Note: Users can add custom arguments via 'cli.compileArguments' setting
  { kind = "process:exec", command = "**/arduino-cli", args = ["compile", "--fqbn", "**", "--only-compilation-database", "**"] },
  { kind = "process:exec", command = "**/arduino-cli", args = ["compile", "--fqbn", "**", "--only-compilation-database", "**", "--config-file", "**"] },
  { kind = "process:exec", command = "**/arduino-cli", args = ["compile", "--fqbn", "**", "--only-compilation-database", "**", "--libraries", "**"] },
  { kind = "process:exec", command = "**/arduino-cli", args = ["compile", "--fqbn", "**", "--only-compilation-database", "**", "--config-file", "**", "--libraries", "**"] },
  # General compile with custom user arguments
  { kind = "process:exec", command = "**/arduino-cli", args = ["compile", "**"] },

  # Clangd: version checking
  { kind = "process:exec", command = "**/clangd", args = ["--version"] },

  # Arduino Language Server: version checking
  { kind = "process:exec", command = "**/arduino-language-server", args = ["--version"] },
]

[language_servers.arduino]
name = "Arduino Language Server"
languages = ["Arduino"]

[grammars.arduino]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-arduino"
commit = "017696bdf47ca2b10948c5a511f9ab387722d0f3"

# Slash commands for AI Assistant
[slash_commands.arduino-board]
description = "Show current Arduino board configuration"
requires_argument = false

[slash_commands.arduino-config]
description = "Show Arduino extension configuration"
requires_argument = false

[slash_commands.arduino-sketch]
description = "Show Arduino sketch structure"
requires_argument = false

[slash_commands.arduino-cores]
description = "List installed Arduino board cores"
requires_argument = false

[slash_commands.arduino-libraries]
description = "List installed Arduino libraries"
requires_argument = false

[slash_commands.arduino-errors]
description = "Show last compilation errors"
requires_argument = false

[slash_commands.arduino-examples]
description = "List available example sketches"
requires_argument = false
