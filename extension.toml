id = "arduino"
name = "Arduino Language Support"
version = "0.0.2"
schema_version = 1
authors = ["Derock Xie <derock@derock.dev>", "Talana <s.j.kusters@proton.me>"]
description = "Complete Arduino development with auto-setup, IntelliSense, board auto-detection, 20 tasks (+9 optional), and 148 snippets."
repository = "https://github.com/SB-CMR-Talana/zed-arduino"
snippets = ["languages/arduino/snippets.json"]

[language_servers.arduino]
name = "Arduino Language Server"
languages = ["Arduino"]

[grammars.arduino]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-arduino"
commit = "017696bdf47ca2b10948c5a511f9ab387722d0f3"

# Slash commands for AI Assistant
[slash_commands."arduino-board"]
description = "Show current Arduino board configuration"
requires_argument = false

[slash_commands."arduino-config"]
description = "Show Arduino extension configuration"
requires_argument = false

[slash_commands."arduino-sketch"]
description = "Show Arduino sketch structure"
requires_argument = false

[slash_commands."arduino-cores"]
description = "List installed Arduino board cores"
requires_argument = false

[slash_commands."arduino-libraries"]
description = "List installed Arduino libraries"
requires_argument = false

[slash_commands."arduino-errors"]
description = "Show last compilation errors"
requires_argument = false

[slash_commands."arduino-examples"]
description = "List available example sketches"
requires_argument = false
